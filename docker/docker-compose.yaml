services:
  mongodb:
    image: mongo:8.2
    container_name: hardverapro-notifier_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ../mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  hardverapro-notifier:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hardverapro-notifier:0.3
    container_name: hardverapro-notifier_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "55555:3000"
    cap_add:
      - SYS_TIME
      - SYS_NICE
    environment:
      - NODE_ENV=dev
      - NODE_CONFIG_ENV=dev
      - TIME_ZONE=Europe/Budapest
      # Optional overrides for sensitive/environment-specific config values.
      # Anything left unset falls back to the value baked into src/config.json.
      # - HARDVERAPRO_USERNAME=
      # - HARDVERAPRO_PASSWORD=
      # - EMAIL_HOST=
      # - EMAIL_PORT=
      # - EMAIL_USER=
      # - EMAIL_PASS=
      # - EMAIL_FROM=
      # - EMAIL_TO=
      # - MONGO_HOST=
      # - MONGO_PORT=
      # - MONGO_DB_NAME=
      # - MONGO_USER=
      # - MONGO_PASS=
    # Optional: mount a JSON file with values that deep-merge over src/config.json.
    # volumes:
    #   - ../config.override.json:/usr/src/app/config/config.override.json:ro
